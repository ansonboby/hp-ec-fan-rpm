name: shellcheck

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: |
          # SC2154/SC2034: the service unit exports ECIO/OUT via the script env;
          # SC1091: install.sh sources nothing external.
          shellcheck -e SC2154,SC2034 hp-ec-fan-rpm
          shellcheck install.sh
